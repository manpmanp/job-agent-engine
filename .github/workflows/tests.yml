# Job-search agent engine
# File:    .github/workflows/tests.yml
# Purpose: Runs the engine's tests and the online Worker's tests on every push.
# Author:  manpmanp <manp.node@gmail.com>
# Generated with Claude (Anthropic), under the author's direction and review.
# License: MIT (see LICENSE)
# Version: 0.4.0
# Date:    2026-10-29
name: tests
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m unittest discover -s tests
  cloud:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloud } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npx tsc --noEmit && npm test
